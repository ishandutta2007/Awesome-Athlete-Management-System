<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #38bdf8;
    }
    .pulse-wave {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: dash 4s linear infinite;
    }
    @keyframes dash {
      to {
        stroke-dashoffset: 0;
      }
    }
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.8; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    .glow-circle {
      animation: pulse 6s ease-in-out infinite;
      transform-origin: center;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Pattern Background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200" />
    <path d="M100 0 V300 M200 0 V300 M300 0 V300 M400 0 V300 M500 0 V300 M600 0 V300 M700 0 V300 M800 0 V300 M900 0 V300 M1000 0 V300 M1100 0 V300" />
  </g>

  <!-- Dynamic Glowing Orbs in Background (Will NOT overlap text) -->
  <circle cx="1020" cy="150" r="120" fill="#38bdf8" opacity="0.15" class="glow-circle" filter="url(#glow)" />
  <circle cx="920" cy="220" r="80" fill="#c084fc" opacity="0.12" class="glow-circle" filter="url(#glow)" />

  <!-- Dynamic ECG / Performance Waveforms (Placed in right background quadrant) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Heartbeat / Load ECG line -->
    <path d="M 750 160 L 820 160 L 835 120 L 850 210 L 870 90 L 890 180 L 905 140 L 920 160 L 1150 160" 
          stroke="url(#accentGrad)" stroke-width="4" opacity="0.8" class="pulse-wave" />
    <!-- Secondary data curve -->
    <path d="M 750 210 Q 850 130 950 190 T 1150 120" 
          stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,6" opacity="0.4" />
  </g>

  <!-- Container Box for Text (Ensures crisp readability) -->
  <rect x="60" y="45" width="660" height="210" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1" />

  <!-- Foreground Content: Header & Text -->
  <g transform="translate(90, 85)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="110" y="19" text-anchor="middle" class="badge">⚡ SPORTS SCIENCE ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="72" class="title">Awesome Athlete Management</text>
    
    <!-- Subtitle -->
    <text x="0" y="112" class="subtitle">Curated Platforms, Open-Source Tools &amp; Data Analytics</text>

    <!-- Decorative Accent Bar -->
    <rect x="0" y="130" width="140" height="4" rx="2" fill="url(#accentGrad)" />
  </g>
</svg>
